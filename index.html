<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>市场云图 · 看盘辅助</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">市场云图</div>
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" data-market="a">A股</button>
        <button class="tab" type="button" data-market="etf">ETF</button>
        <button class="tab" type="button" data-market="cb">可转债</button>
        <button class="tab" type="button" data-market="hk">港股</button>
      </div>
      <div class="group">
        <label>面积</label>
        <div id="metrics" class="tabs"></div>
      </div>
      <div class="meta" id="meta"></div>
    </header>
    <div id="chart"></div>
    <div class="legend">
      <span>跌</span>
      <div class="legend-bar" title="颜色映射涨跌幅（红涨绿跌）"></div>
      <span>涨</span>
      <span class="hint">方块面积 = 所选规模指标 · 滚轮缩放 · 拖拽平移 · 悬停看明细</span>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- Local vendor: works offline / file:// -->
  <script src="vendor/echarts.min.js"></script>
  <!-- Data as JS globals (file:// cannot reliably fetch JSON) -->
  <script src="data/meta.js"></script>
  <script src="data/a.js"></script>
  <script src="data/etf.js"></script>
  <script src="data/cb.js"></script>
  <script src="data/hk.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
